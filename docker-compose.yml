services:
  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://13.60.248.143:3001"
    ports:
      - "3000:3000"

  express:
    volumes:
      - ./mysql-tls/ca.pem:/etc/mysql/tls/ca.pem:ro
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_SSL_CA: /etc/mysql/tls/ca.pem
      DB_PORT: 3306
      DB_USER: bank_app
      DB_PASSWORD: bank_password
      DB_NAME: bank
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"

  mysql:
    image: mysql:8.4
    command:
      - --ssl-ca=/etc/mysql/tls/ca.pem
      - --ssl-cert=/etc/mysql/tls/server-cert.pem
      - --ssl-key=/etc/mysql/tls/server-key.pem
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank
      MYSQL_USER: bank_app
      MYSQL_PASSWORD: bank_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql-tls/ca.pem:/etc/mysql/tls/ca.pem:ro
      - ./mysql-tls/server-cert.pem:/etc/mysql/tls/server-cert.pem:ro
      - ./mysql-tls/server-key.pem:/etc/mysql/tls/server-key.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
