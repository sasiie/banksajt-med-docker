name: Build Docker Images

on:
  workflow_run:
    workflows:
      - Tester
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Hämta testad kod
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Logga in på GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Förbered Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bygg och publicera Next.js
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://13.60.248.143:3001
          tags: ghcr.io/sasiie/banksajt-nextjs:${{ github.event.workflow_run.head_sha }}

      - name: Bygg och publicera Express
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/sasiie/banksajt-express:${{ github.event.workflow_run.head_sha }}
