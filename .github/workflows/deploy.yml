name: Deploy Bank App

on:
  workflow_run:
    workflows:
      - Build Docker Images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/banksajt-med-docker
            git fetch origin main
            git checkout main
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            sudo IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.yml -f docker-compose.prod.yml pull nextjs express
            sudo IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
