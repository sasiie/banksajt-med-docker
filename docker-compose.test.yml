services:
  nextjs:
    build:
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3003"
    ports: !override
      - "3002:3000"

  express:
    environment:
      DB_SSL_CA: ""
      NODE_ENV: test
    volumes: !override []
    ports: !override
      - "3003:3001"

  mysql:
    command: !override []
    volumes: !override
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: !override
      - "3308:3306"
